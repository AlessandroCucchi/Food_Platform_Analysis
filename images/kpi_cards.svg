<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Key metrics: sessions grew 5.8 times, sign-ups stayed flat, 23 percent of users at risk, rating up 0.17">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16301f"/><stop offset="1" stop-color="#2f6b43"/></linearGradient></defs>
<rect x="0" y="0" width="291" height="210" rx="16" fill="url(#g)"/>
<text x="26" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f2a541">x5.8</text>
<text x="26" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Sessions per year</text>
<text x="26" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cfe3c4">108 in 2021 to 623 in 2023</text>
<rect x="303" y="0" width="291" height="210" rx="16" fill="url(#g)"/>
<text x="329" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f2a541">Flat</text>
<text x="329" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">New sign-ups</text>
<text x="329" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cfe3c4">about 6-7 per month</text>
<rect x="606" y="0" width="291" height="210" rx="16" fill="url(#g)"/>
<text x="632" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f2a541">23%</text>
<text x="632" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Users at risk</text>
<text x="632" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cfe3c4">active before, gone ~200 days</text>
<rect x="909" y="0" width="291" height="210" rx="16" fill="url(#g)"/>
<text x="935" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#f2a541">+0.17</text>
<text x="935" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Average rating</text>
<text x="935" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cfe3c4">3.00 to 3.17 stars</text>
</svg>